<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/store.css">
    <title>Products | Winora Brewery</title>
</head>
<body>

    <!-- Header -->
    <header>

        <div class="layout horizontal">

            <!-- navigation -->
            <nav>
                <a href="products.html">Products</a>
                <a href="collection.html">Collections</a>
                <a href="partners.html">Partners</a>
                <a href="about.html">About</a>
            </nav>

            <!-- logo -->
            <div class="logo">
                <a href="index.html">
                    <img src="img/site/winova-b.png" alt="Winora">
                </a>
            </div>

            <!-- icons -->
            <div class="side-nav">
                <a href="search.html">
                    <img src="img/site/search.png" alt="search">
                </a>

                <a href="account.html">
                    <img src="img/site/user.png" alt="phone">
                </a>

                <a href="contact.html">
                    <img src="img/site/call.png" alt="phone">
                </a>
                
                <a href="cart.html">
                    <img src="img/site/cart.png" alt="cart">
                </a>
            </div>

        </div>

    </header>

    <main>
        <div class="bread layout horizontal">
            <a href="index.html" class="anch">Home</a>
            <p class="angle">></p>
            <p class="base">Products</p>
        </div>

        <!-- All Products -->
        <div class="featured">
            <div class="layout vertical ver-feature">
                <div class="section-top">
                    <h2 id="products-title">All products</h2>
                </div>

                <div class="product-grid" id="all-products">
                    <!-- All products will be inserted here -->
                </div>
            </div>
        </div>

        

    </main>

    
    <!-- Scripts -->
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    
</body>
</html>
